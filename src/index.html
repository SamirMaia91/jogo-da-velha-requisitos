<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jogo da Velha - UNIFOR</title>

    <style>
        :root {
            --azul-unifor: #003366;
            --azul-destaque: #0056b3;
            --laranja: #d97706;
            --fundo: #f4f6f9;
            --branco: #ffffff;
            --cinza: #64748b;
            --borda: #dbe2ea;
            --verde: #16a34a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background: var(--fundo);
            font-family: Arial, Helvetica, sans-serif;
            color: var(--azul-unifor);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 720px;

            background: var(--branco);

            border-radius: 20px;
            padding: 30px;

            box-shadow: 0 10px 35px rgba(0, 51, 102, 0.12);

            position: relative;
            overflow: hidden;
        }

        /* =========================
           CABEÇALHO
        ========================= */

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        .institucional {
            color: var(--azul-destaque);
            font-size: 0.85rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        h1 {
            color: var(--azul-unifor);
            font-size: 2rem;
            letter-spacing: 1px;
        }

        /* =========================
           CONFIGURAÇÕES
        ========================= */

        .configuracoes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 25px;
        }

        .campo-config {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .campo-config label {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--cinza);
        }

        select {
            width: 100%;
            padding: 11px 12px;

            border: 1px solid var(--borda);
            border-radius: 8px;

            background: white;
            color: var(--azul-unifor);

            font-size: 0.95rem;
            cursor: pointer;
        }

        select:focus {
            outline: 2px solid rgba(0, 86, 179, 0.2);
            border-color: var(--azul-destaque);
        }

        /* =========================
           PLACAR
        ========================= */

        .placar {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;

            background: #f8fafc;
            border: 1px solid var(--borda);
            border-radius: 14px;

            padding: 18px;
            margin-bottom: 20px;
        }

        .jogador-placar {
            text-align: center;
        }

        .jogador-placar .nome {
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--cinza);
        }

        .jogador-placar .pontos {
            display: block;

            margin-top: 5px;

            font-size: 2rem;
            font-weight: bold;
        }

        #scoreX {
            color: var(--azul-destaque);
        }

        #scoreO {
            color: var(--laranja);
        }

        .rodada {
            text-align: center;
            padding: 0 25px;
        }

        .rodada span {
            display: block;

            font-size: 0.75rem;
            color: var(--cinza);
            font-weight: bold;

            margin-bottom: 4px;
        }

        #roundDisplay {
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--azul-unifor);
        }

        /* =========================
           STATUS
        ========================= */

        .status {
            min-height: 35px;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            font-weight: bold;
            color: var(--azul-unifor);

            margin-bottom: 18px;
        }

        .final-message {
            color: var(--verde);
        }

        /* =========================
           TABULEIRO
        ========================= */

        .board-container {
            width: min(400px, 90vw);
            aspect-ratio: 1 / 1;

            margin: 0 auto 25px;

            position: relative;
        }

        .board {
            width: 100%;
            height: 100%;

            display: grid;

            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);

            gap: 8px;

            background: var(--azul-unifor);

            padding: 8px;

            border-radius: 12px;
        }

        .cell {
            border: none;
            border-radius: 7px;

            background: white;

            font-size: clamp(2.5rem, 10vw, 4.5rem);
            font-weight: bold;

            cursor: pointer;

            transition:
                transform 0.12s ease,
                background 0.12s ease;
        }

        .cell:hover:not(:disabled) {
            background: #eef5fb;
            transform: scale(0.97);
        }

        .cell:disabled {
            cursor: default;
        }

        .cell.x {
            color: var(--azul-destaque);
        }

        .cell.o {
            color: var(--laranja);
        }

        /* =========================
           LINHA DA VITÓRIA
        ========================= */

        .win-line {
            position: absolute;

            height: 6px;

            background: var(--laranja);

            border-radius: 10px;

            transform-origin: left center;

            opacity: 0;

            pointer-events: none;

            z-index: 5;

            transition: opacity 0.25s ease;
        }

        .win-line.visible {
            opacity: 1;
        }

        /* =========================
           BOTÃO
        ========================= */

        .restart {
            display: block;

            margin: 0 auto;

            padding: 13px 25px;

            border: none;
            border-radius: 8px;

            background: var(--azul-unifor);
            color: white;

            font-size: 0.9rem;
            font-weight: bold;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.1s ease;
        }

        .restart:hover {
            background: var(--azul-destaque);
        }

        .restart:active {
            transform: scale(0.97);
        }

        /* =========================
           CONFETES
        ========================= */

        #confettiCanvas {
            position: fixed;

            inset: 0;

            width: 100vw;
            height: 100vh;

            pointer-events: none;

            z-index: 9999;
        }

        /* =========================
           RESPONSIVIDADE
        ========================= */

        @media (max-width: 550px) {

            body {
                padding: 12px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 1.6rem;
            }

            .configuracoes {
                grid-template-columns: 1fr;
            }

            .placar {
                padding: 13px 8px;
            }

            .rodada {
                padding: 0 10px;
            }
        }
    </style>
</head>

<body>

    <canvas id="confettiCanvas"></canvas>

    <main class="container">

        <!-- CABEÇALHO -->

        <header>
            <div class="institucional">
                UNIVERSIDADE DE FORTALEZA
            </div>

            <h1>JOGO DA VELHA</h1>
        </header>


        <!-- CONFIGURAÇÕES -->

        <section class="configuracoes">

            <div class="campo-config">

                <label for="modeSelect">
                    Modo de Jogo
                </label>

                <select id="modeSelect">

                    <option value="pvp">
                        2 Jogadores (PVP)
                    </option>

                    <option value="cpu">
                        Contra o Computador
                    </option>

                </select>

            </div>


            <div class="campo-config">

                <label for="formatSelect">
                    Formato da Partida
                </label>

                <select id="formatSelect">

                    <option value="single">
                        Partida Única
                    </option>

                    <option value="bo3">
                        Melhor de 3 (MD3)
                    </option>

                </select>

            </div>

        </section>


        <!-- PLACAR -->

        <section class="placar">

            <div class="jogador-placar">

                <span class="nome">
                    JOGADOR X
                </span>

                <span class="pontos" id="scoreX">
                    0
                </span>

            </div>


            <div class="rodada">

                <span>
                    RODADA
                </span>

                <strong id="roundDisplay">
                    1/1
                </strong>

            </div>


            <div class="jogador-placar">

                <span class="nome" id="playerOLabel">
                    JOGADOR O
                </span>

                <span class="pontos" id="scoreO">
                    0
                </span>

            </div>

        </section>


        <!-- STATUS -->

        <div class="status" id="status">
            Vez do Jogador X
        </div>


        <!-- TABULEIRO -->

        <div class="board-container">

            <div class="board" id="board">

                <button class="cell" data-index="0"></button>
                <button class="cell" data-index="1"></button>
                <button class="cell" data-index="2"></button>

                <button class="cell" data-index="3"></button>
                <button class="cell" data-index="4"></button>
                <button class="cell" data-index="5"></button>

                <button class="cell" data-index="6"></button>
                <button class="cell" data-index="7"></button>
                <button class="cell" data-index="8"></button>

            </div>

            <div class="win-line" id="winLine"></div>

        </div>


        <!-- REINICIAR -->

        <button class="restart" id="restartButton">
            REINICIAR JOGO
        </button>

    </main>


    <script>

        /* =========================================================
           1. ELEMENTOS DA INTERFACE
        ========================================================= */

        const cells = document.querySelectorAll(".cell");

        const statusElement =
            document.getElementById("status");

        const scoreXElement =
            document.getElementById("scoreX");

        const scoreOElement =
            document.getElementById("scoreO");

        const roundDisplay =
            document.getElementById("roundDisplay");

        const modeSelect =
            document.getElementById("modeSelect");

        const formatSelect =
            document.getElementById("formatSelect");

        const playerOLabel =
            document.getElementById("playerOLabel");

        const restartButton =
            document.getElementById("restartButton");

        const boardContainer =
            document.querySelector(".board-container");

        const winLine =
            document.getElementById("winLine");


        /* =========================================================
           2. ESTADO DO JOGO
        ========================================================= */

        let options = Array(9).fill("");

        let currentPlayer = "X";

        let running = true;

        let winsX = 0;

        let winsO = 0;

        let currentRound = 1;

        let modeSelectValue = "pvp";

        let formatSelectValue = "single";

        let roundFinished = false;


        /*
         * IMPORTANTE:
         *
         * Guardamos os IDs dos timers.
         *
         * Isso permite cancelar:
         *
         * 1. Timer da CPU
         * 2. Timer da próxima rodada
         *
         * quando o usuário reinicia
         * ou altera uma configuração.
         */

        let cpuTimer = null;

        let roundTimer = null;


        /* =========================================================
           3. COMBINAÇÕES DE VITÓRIA
        ========================================================= */

        const winPatterns = [

            [0, 1, 2],
            [3, 4, 5],
            [6, 7, 8],

            [0, 3, 6],
            [1, 4, 7],
            [2, 5, 8],

            [0, 4, 8],
            [2, 4, 6]

        ];


        /* =========================================================
           4. EVENTOS DAS CÉLULAS
        ========================================================= */

        cells.forEach(cell => {

            cell.addEventListener("click", () => {

                const index =
                    Number(cell.dataset.index);

                playMove(index);

            });

        });


        /* =========================================================
           5. REALIZA UMA JOGADA
        ========================================================= */

        function playMove(index) {

            /*
             * Não permite jogar quando:
             *
             * - jogo está bloqueado
             * - célula já foi utilizada
             */

            if (
                !running ||
                options[index] !== ""
            ) {
                return;
            }


            /*
             * Registra a jogada.
             */

            options[index] =
                currentPlayer;


            updateCell(index);


            playMoveSound(currentPlayer);


            /*
             * Verifica vitória.
             */

            const winningPattern =
                checkWinner();


            if (winningPattern) {

                finishRoundWithWinner(
                    currentPlayer,
                    winningPattern
                );

                return;
            }


            /*
             * Verifica empate.
             */

            if (checkDraw()) {

                finishRoundWithDraw();

                return;
            }


            /*
             * Troca jogador.
             */

            currentPlayer =
                currentPlayer === "X"
                    ? "O"
                    : "X";


            updateStatus();


            /*
             * CPU joga automaticamente.
             */

            if (
                modeSelectValue === "cpu" &&
                currentPlayer === "O"
            ) {

                computerMove();

            }

        }


        /* =========================================================
           6. ATUALIZA CÉLULA
        ========================================================= */

        function updateCell(index) {

            const cell = cells[index];

            cell.textContent =
                options[index];

            cell.classList.remove(
                "x",
                "o"
            );


            if (options[index] === "X") {

                cell.classList.add("x");

            }


            if (options[index] === "O") {

                cell.classList.add("o");

            }


            /*
             * Impede clicar novamente
             * na mesma célula.
             */

            cell.disabled = true;

        }


        /* =========================================================
           7. VERIFICA VENCEDOR
        ========================================================= */

        function checkWinner() {

            for (
                const pattern of winPatterns
            ) {

                const [a, b, c] =
                    pattern;


                if (
                    options[a] !== "" &&
                    options[a] === options[b] &&
                    options[a] === options[c]
                ) {

                    return pattern;

                }

            }

            return null;

        }


        /* =========================================================
           8. VERIFICA EMPATE
        ========================================================= */

        function checkDraw() {

            return options.every(
                cell => cell !== ""
            );

        }


        /* =========================================================
           9. FINALIZA COM VITÓRIA
        ========================================================= */

        function finishRoundWithWinner(
            winner,
            winningPattern
        ) {

            /*
             * Bloqueia imediatamente.
             */

            running = false;

            roundFinished = true;


            drawWinningLine(
                winningPattern
            );


            launchConfetti();


            playWinSound();


            /*
             * Atualiza placar.
             */

            if (winner === "X") {

                winsX++;

            } else {

                winsO++;

            }


            updateScore();


            statusElement.textContent =
                `Jogador ${winner} venceu a rodada!`;

            statusElement.classList.add(
                "final-message"
            );


            handleRoundEnd();

        }


        /* =========================================================
           10. FINALIZA COM EMPATE
        ========================================================= */

        function finishRoundWithDraw() {

            running = false;

            roundFinished = true;


            playDrawSound();


            statusElement.textContent =
                "Rodada Empatada!";

            statusElement.classList.add(
                "final-message"
            );


            handleDrawEnd();

        }


        /* =========================================================
           11. FIM DA RODADA
        ========================================================= */

        function handleRoundEnd() {

            /*
             * Partida única:
             * fica aguardando o usuário reiniciar.
             */

            if (
                formatSelectValue === "single"
            ) {

                return;

            }


            /*
             * MD3:
             * quem fizer 2 vitórias
             * é campeão.
             */

            if (
                winsX >= 2 ||
                winsO >= 2
            ) {

                const champion =
                    winsX >= 2
                        ? "X"
                        : "O";


                const championName =
                    champion === "X"
                        ? "Jogador X"
                        : (
                            modeSelectValue === "cpu"
                                ? "Computador"
                                : "Jogador O"
                        );


                statusElement.textContent =
                    `${championName} é o campeão da partida!`;

                return;

            }


            /*
             * Próxima rodada.
             */

            if (currentRound < 3) {

                /*
                 * Cancela qualquer timer
                 * anterior antes de criar outro.
                 */

                clearTimeout(roundTimer);


                roundTimer = setTimeout(() => {

                    roundTimer = null;


                    /*
                     * IMPORTANTE:
                     *
                     * O timer só pode continuar
                     * se o jogo ainda estiver
                     * no estado esperado.
                     */

                    if (
                        !roundFinished ||
                        formatSelectValue !== "bo3"
                    ) {
                        return;
                    }


                    currentRound++;

                    prepareNextRound();

                }, 2000);

            }

        }


        /* =========================================================
           12. EMPATE NO MD3
        ========================================================= */

        function handleDrawEnd() {

            if (
                formatSelectValue === "single"
            ) {

                return;

            }


            if (currentRound < 3) {

                clearTimeout(roundTimer);


                roundTimer = setTimeout(() => {

                    roundTimer = null;


                    if (
                        !roundFinished ||
                        formatSelectValue !== "bo3"
                    ) {
                        return;
                    }


                    /*
                     * Empate não incrementa
                     * a rodada.
                     */

                    prepareNextRound(false);

                }, 2000);

            } else {

                statusElement.textContent =
                    "Partida encerrada com empate!";

            }

        }


        /* =========================================================
           13. PREPARA PRÓXIMA RODADA
        ========================================================= */

        function prepareNextRound() {

            options =
                Array(9).fill("");


            /*
             * X começa todas as rodadas.
             */

            currentPlayer = "X";


            running = true;

            roundFinished = false;


            hideWinningLine();


            statusElement.classList.remove(
                "final-message"
            );


            /*
             * Limpa células.
             */

            cells.forEach(cell => {

                cell.textContent = "";

                cell.disabled = false;

                cell.classList.remove(
                    "x",
                    "o"
                );

            });


            updateRoundDisplay();

            updateStatus();

        }


        /* =========================================================
           14. JOGADA DO COMPUTADOR
        ========================================================= */

        function computerMove() {

            /*
             * Bloqueia jogador durante
             * os 400ms de espera.
             */

            running = false;


            statusElement.textContent =
                "Computador pensando...";


            /*
             * Cancela timer anterior.
             */

            clearTimeout(cpuTimer);


            /*
             * TIMER DE 400ms
             *
             * Agora o ID fica salvo em
             * cpuTimer.
             */

            cpuTimer = setTimeout(() => {

                cpuTimer = null;


                /*
                 * Se o usuário reiniciou,
                 * mudou de modo ou o jogo
                 * não está mais na vez da CPU,
                 * o timer não faz nada.
                 */

                if (
                    modeSelectValue !== "cpu" ||
                    formatSelectValue === "" ||
                    currentPlayer !== "O"
                ) {

                    return;

                }


                /*
                 * Procura posições vazias.
                 */

                const emptyPositions = [];


                options.forEach(
                    (value, index) => {

                        if (value === "") {

                            emptyPositions.push(index);

                        }

                    }
                );


                if (
                    emptyPositions.length === 0
                ) {

                    return;

                }


                /*
                 * Escolhe aleatoriamente.
                 */

                const randomIndex =
                    Math.floor(
                        Math.random() *
                        emptyPositions.length
                    );


                const chosenPosition =
                    emptyPositions[
                        randomIndex
                    ];


                /*
                 * Realiza jogada da CPU.
                 */

                options[chosenPosition] = "O";


                updateCell(
                    chosenPosition
                );


                playMoveSound("O");


                /*
                 * Verifica vitória.
                 */

                const winningPattern =
                    checkWinner();


                if (winningPattern) {

                    finishRoundWithWinner(
                        "O",
                        winningPattern
                    );

                    return;

                }


                /*
                 * Verifica empate.
                 */

                if (checkDraw()) {

                    finishRoundWithDraw();

                    return;

                }


                /*
                 * Volta para X.
                 */

                currentPlayer = "X";

                running = true;

                updateStatus();

            }, 400);

        }


        /* =========================================================
           15. ATUALIZA STATUS
        ========================================================= */

        function updateStatus() {

            if (running) {

                if (
                    modeSelectValue === "cpu" &&
                    currentPlayer === "O"
                ) {

                    statusElement.textContent =
                        "Vez do Computador";

                    return;

                }


                statusElement.textContent =
                    `Vez do Jogador ${currentPlayer}`;

            }

        }


        /* =========================================================
           16. ATUALIZA PLACAR
        ========================================================= */

        function updateScore() {

            scoreXElement.textContent =
                winsX;

            scoreOElement.textContent =
                winsO;

        }


        /* =========================================================
           17. ATUALIZA RODADA
        ========================================================= */

        function updateRoundDisplay() {

            if (
                formatSelectValue === "single"
            ) {

                roundDisplay.textContent =
                    "1/1";

                return;

            }


            roundDisplay.textContent =
                `${currentRound}/3`;

        }


        /* =========================================================
           18. ALTERAÇÃO DO MODO
        ========================================================= */

        modeSelect.addEventListener(
            "change",
            () => {

                modeSelectValue =
                    modeSelect.value;


                /*
                 * IMPORTANTE:
                 *
                 * resetGame() cancela todos
                 * os timers pendentes.
                 */

                resetGame();


                if (
                    modeSelectValue === "cpu"
                ) {

                    playerOLabel.textContent =
                        "COMPUTADOR";

                } else {

                    playerOLabel.textContent =
                        "JOGADOR O";

                }

            }
        );


        /* =========================================================
           19. ALTERAÇÃO DO FORMATO
        ========================================================= */

        formatSelect.addEventListener(
            "change",
            () => {

                formatSelectValue =
                    formatSelect.value;


                /*
                 * Alterar formato reinicia
                 * completamente a partida.
                 */

                resetGame();

            }
        );


        /* =========================================================
           20. BOTÃO REINICIAR
        ========================================================= */

        restartButton.addEventListener(
            "click",
            () => {

                resetGame();

            }
        );


        /* =========================================================
           21. RESET COMPLETO
        ========================================================= */

        function resetGame() {

            /*
             * =====================================================
             * CORREÇÃO PRINCIPAL
             * =====================================================
             *
             * Cancela o timer da CPU.
             */

            clearTimeout(cpuTimer);

            cpuTimer = null;


            /*
             * Cancela o timer da próxima rodada.
             */

            clearTimeout(roundTimer);

            roundTimer = null;


            /*
             * Limpa tabuleiro.
             */

            options =
                Array(9).fill("");


            /*
             * X começa.
             */

            currentPlayer = "X";


            /*
             * Zera placar.
             */

            winsX = 0;

            winsO = 0;


            /*
             * Volta para primeira rodada.
             */

            currentRound = 1;


            /*
             * Libera jogo.
             */

            running = true;

            roundFinished = false;


            /*
             * Esconde linha.
             */

            hideWinningLine();


            /*
             * Remove mensagem final.
             */

            statusElement.classList.remove(
                "final-message"
            );


            /*
             * Limpa todas as células.
             */

            cells.forEach(cell => {

                cell.textContent = "";

                cell.disabled = false;

                cell.classList.remove(
                    "x",
                    "o"
                );

            });


            /*
             * Atualiza interface.
             */

            updateScore();

            updateRoundDisplay();

            updateStatus();

        }


        /* =========================================================
           22. LINHA DE VITÓRIA
        ========================================================= */

        function drawWinningLine(pattern) {

            const firstCell =
                cells[pattern[0]];


            const lastCell =
                cells[pattern[2]];


            const firstRect =
                firstCell.getBoundingClientRect();


            const lastRect =
                lastCell.getBoundingClientRect();


            const containerRect =
                boardContainer.getBoundingClientRect();


            /*
             * Centro da primeira célula.
             */

            const startX =
                firstRect.left +
                firstRect.width / 2 -
                containerRect.left;


            const startY =
                firstRect.top +
                firstRect.height / 2 -
                containerRect.top;


            /*
             * Centro da última célula.
             */

            const endX =
                lastRect.left +
                lastRect.width / 2 -
                containerRect.left;


            const endY =
                lastRect.top +
                lastRect.height / 2 -
                containerRect.top;


            const deltaX =
                endX - startX;


            const deltaY =
                endY - startY;


            const distance =
                Math.sqrt(
                    deltaX * deltaX +
                    deltaY * deltaY
                );


            const angle =
                Math.atan2(
                    deltaY,
                    deltaX
                ) *
                (180 / Math.PI);


            /*
             * =====================================================
             * CORREÇÃO GEOMÉTRICA
             * =====================================================
             *
             * A linha possui 6px de altura.
             *
             * Subtraímos metade da altura
             * para centralizar exatamente
             * no ponto calculado.
             */

            winLine.style.left =
                `${startX}px`;


            winLine.style.top =
                `${startY - 3}px`;


            winLine.style.width =
                `${distance}px`;


            winLine.style.transform =
                `rotate(${angle}deg)`;


            winLine.classList.add(
                "visible"
            );

        }


        /* =========================================================
           23. ESCONDER LINHA
        ========================================================= */

        function hideWinningLine() {

            winLine.classList.remove(
                "visible"
            );

            winLine.style.width = "0";

        }


        /* =========================================================
           24. WEB AUDIO API
        ========================================================= */

        let audioContext = null;


        function getAudioContext() {

            if (!audioContext) {

                const AudioContext =
                    window.AudioContext ||
                    window.webkitAudioContext;


                if (!AudioContext) {

                    return null;

                }


                audioContext =
                    new AudioContext();

            }


            if (
                audioContext.state ===
                "suspended"
            ) {

                audioContext.resume();

            }


            return audioContext;

        }


        /* =========================================================
           25. SOM DE JOGADA
        ========================================================= */

        function playMoveSound(player) {

            const ctx =
                getAudioContext();


            if (!ctx) {
                return;
            }


            const frequency =
                player === "X"
                    ? 440
                    : 330;


            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type = "sine";


            oscillator.frequency.value =
                frequency;


            gain.gain.setValueAtTime(
                0.0001,
                ctx.currentTime
            );


            gain.gain.exponentialRampToValueAtTime(
                0.12,
                ctx.currentTime + 0.01
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                ctx.currentTime + 0.12
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start();


            oscillator.stop(
                ctx.currentTime + 0.13
            );

        }


        /* =========================================================
           26. SOM DE VITÓRIA
        ========================================================= */

        function playWinSound() {

            const ctx =
                getAudioContext();


            if (!ctx) {
                return;
            }


            const frequencies = [
                523.25,
                659.25,
                783.99
            ];


            frequencies.forEach(
                (frequency, index) => {

                    const oscillator =
                        ctx.createOscillator();


                    const gain =
                        ctx.createGain();


                    oscillator.type =
                        "sine";


                    oscillator.frequency.value =
                        frequency;


                    const startTime =
                        ctx.currentTime +
                        index * 0.12;


                    gain.gain.setValueAtTime(
                        0.0001,
                        startTime
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.16,
                        startTime + 0.02
                    );


                    gain.gain.exponentialRampToValueAtTime(
                        0.0001,
                        startTime + 0.35
                    );


                    oscillator.connect(gain);

                    gain.connect(
                        ctx.destination
                    );


                    oscillator.start(
                        startTime
                    );


                    oscillator.stop(
                        startTime + 0.36
                    );

                }
            );

        }


        /* =========================================================
           27. SOM DE EMPATE
        ========================================================= */

        function playDrawSound() {

            const ctx =
                getAudioContext();


            if (!ctx) {
                return;
            }


            const oscillator =
                ctx.createOscillator();


            const gain =
                ctx.createGain();


            oscillator.type =
                "triangle";


            oscillator.frequency.value =
                220;


            gain.gain.setValueAtTime(
                0.0001,
                ctx.currentTime
            );


            gain.gain.exponentialRampToValueAtTime(
                0.12,
                ctx.currentTime + 0.02
            );


            gain.gain.exponentialRampToValueAtTime(
                0.0001,
                ctx.currentTime + 0.4
            );


            oscillator.connect(gain);

            gain.connect(
                ctx.destination
            );


            oscillator.start();

            oscillator.stop(
                ctx.currentTime + 0.41
            );

        }


        /* =========================================================
           28. CONFETES
        ========================================================= */

        const confettiCanvas =
            document.getElementById(
                "confettiCanvas"
            );


        const confettiContext =
            confettiCanvas.getContext(
                "2d"
            );


        let confettiParticles = [];

        let confettiAnimation = null;


        function resizeConfettiCanvas() {

            confettiCanvas.width =
                window.innerWidth;

            confettiCanvas.height =
                window.innerHeight;

        }


        window.addEventListener(
            "resize",
            resizeConfettiCanvas
        );


        resizeConfettiCanvas();


        function launchConfetti() {

            confettiParticles = [];


            for (
                let i = 0;
                i < 180;
                i++
            ) {

                confettiParticles.push({

                    x:
                        Math.random() *
                        confettiCanvas.width,

                    y:
                        -20 -
                        Math.random() *
                        confettiCanvas.height,

                    width:
                        5 +
                        Math.random() * 7,

                    height:
                        8 +
                        Math.random() * 10,

                    speed:
                        2 +
                        Math.random() * 4,

                    drift:
                        -2 +
                        Math.random() * 4,

                    rotation:
                        Math.random() * 360,

                    rotationSpeed:
                        -5 +
                        Math.random() * 10

                });

            }


            if (confettiAnimation) {

                cancelAnimationFrame(
                    confettiAnimation
                );

            }


            animateConfetti();

        }


        function animateConfetti() {

            confettiContext.clearRect(
                0,
                0,
                confettiCanvas.width,
                confettiCanvas.height
            );


            let activeParticles = 0;


            confettiParticles.forEach(
                particle => {

                    particle.y +=
                        particle.speed;

                    particle.x +=
                        particle.drift;

                    particle.rotation +=
                        particle.rotationSpeed;


                    if (
                        particle.y <
                        confettiCanvas.height + 30
                    ) {

                        activeParticles++;

                    }


                    confettiContext.save();


                    confettiContext.translate(
                        particle.x,
                        particle.y
                    );


                    confettiContext.rotate(
                        particle.rotation *
                        Math.PI /
                        180
                    );


                    /*
                     * Usa cores geradas
                     * dinamicamente.
                     */

                    const hue =
                        Math.floor(
                            Math.random() * 360
                        );


                    confettiContext.fillStyle =
                        `hsl(${hue}, 80%, 55%)`;


                    confettiContext.fillRect(
                        -particle.width / 2,
                        -particle.height / 2,
                        particle.width,
                        particle.height
                    );


                    confettiContext.restore();

                }
            );


            if (activeParticles > 0) {

                confettiAnimation =
                    requestAnimationFrame(
                        animateConfetti
                    );

            } else {

                confettiContext.clearRect(
                    0,
                    0,
                    confettiCanvas.width,
                    confettiCanvas.height
                );

                confettiAnimation = null;

            }

        }


        /* =========================================================
           29. INICIALIZAÇÃO
        ========================================================= */

        updateScore();

        updateRoundDisplay();

        updateStatus();

    </script>
